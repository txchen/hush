name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: contracts/verify-go/go.sum
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:crypto
      - run: npm run test:crypto:go

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: macos-14
            arch: arm64
          - runner: macos-15
            arch: arm64
          - runner: macos-26
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/cli/go.sum
      - name: Verify native platform, formatting, tests and vet
        working-directory: apps/cli
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o ../../dist/native/hush ./cmd/hush
          ../../dist/native/hush version
      - name: Run static test binary in Alpine
        if: runner.os == 'Linux'
        run: |
          cd apps/cli
          CGO_ENABLED=0 go test -c -o ../../dist/native/hush.test ./internal/hush
          cd ../..
          docker run --rm -v "$PWD:/src:ro" -w /src/apps/cli/internal/hush alpine:3.23 /src/dist/native/hush.test

  build:
    runs-on: ubuntu-24.04
    needs: [test, service-and-web]
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/cli/go.sum
      - name: Build all archives
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="0.0.0-dev.g${GITHUB_SHA:0:12}"
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          fi
          python3 scripts/build-cli.py --version "$version"
          python3 scripts/package-cli-npm.py --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hush-cli
          path: dist/cli/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hush-npm
          path: dist/npm/${{ steps.package.outputs.version }}/*.tgz
          if-no-files-found: error

  npm-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: hush-npm
          path: dist/npm/${{ needs.build.outputs.version }}
      - run: node --test scripts/test-cli-npm.mjs
        env:
          HUSH_NPM_VERSION: ${{ needs.build.outputs.version }}

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [build, npm-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@11.6.2
      - uses: actions/download-artifact@v4
        with:
          name: hush-npm
          path: dist/npm/${{ needs.build.outputs.version }}
      - run: node scripts/publish-cli-npm.mjs "$HUSH_NPM_VERSION"
        env:
          HUSH_NPM_VERSION: ${{ needs.build.outputs.version }}
