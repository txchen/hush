            nonce:
              type: string
              minLength: 16
              maxLength: 16
              pattern: ^[A-Za-z0-9_-]+$
            ciphertext:
              type: string
              minLength: 22
              maxLength: 16267
              pattern: ^[A-Za-z0-9_-]+$
          required:
            - format
