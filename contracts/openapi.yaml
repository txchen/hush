components:
  schemas:
    Init:
      type: object
      properties:
        id: &a19
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name: &a20
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x1f\x7f]+$
        kdf: &a21
          type: object
          properties:
            algorithm:
              type: string
              const: Argon2id
            version:
              type: number
              const: 19
            salt:
              type: string
              minLength: 22
              maxLength: 22
              pattern: ^[A-Za-z0-9_-]+$
            memory_kib:
              type: number
              const: 65536
            iterations:
              type: number
              const: 3
            parallelism:
              type: number
              const: 1
          required:
            - algorithm
            - version
            - salt
            - memory_kib
            - iterations
            - parallelism
          additionalProperties: false
        master_wrap: &a22
          type: object
          properties:
            format:
              type: number
              const: 1
            algorithm:
              type: string
              const: AES-256-GCM
            nonce:
              type: string
              minLength: 16
              maxLength: 16
              pattern: ^[A-Za-z0-9_-]+$
            ciphertext:
              type: string
              minLength: 64
              maxLength: 64
              pattern: ^[A-Za-z0-9_-]+$
          required:
            - format
            - algorithm
            - nonce
            - ciphertext
          additionalProperties: false
      required:
        - id
        - name
        - kdf
        - master_wrap
      additionalProperties: false
    SecretInput:
