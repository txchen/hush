              schema:
                $ref: "#/components/schemas/Error"
  /database/{table}:
    get:
      operationId: getDatabaseRows
      summary: Read raw SQLite rows; never decrypts or executes supplied SQL
      security: *a3
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            enum: *a5
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Success. Never contains plaintext secrets or private keys.
          headers:
            ETag:
              description: Quoted vault revision when a vault exists.
              schema: *a2
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  table: *a2
                  columns:
                    type: array
                    items:
                      type: object
                      properties:
                        cid:
                          type: integer
                        name: *a2
                        type: *a2
                        notnull:
                          type: integer
                        dflt_value: {}
                        pk:
                          type: integer
                        hidden:
                          type: integer
                      required:
                        - cid
                        - name
                        - type
                        - notnull
                        - dflt_value
                        - pk
                        - hidden
                      additionalProperties: false
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                    minimum: 0
                  offset:
                    type: integer
                    minimum: 0
                  limit:
                    const: 50
                required:
                  - table
                  - columns
                  - rows
                  - total
                  - offset
                  - limit
                additionalProperties: false
        "400":
          description: Invalid input
