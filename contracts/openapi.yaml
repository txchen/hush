  /database:
    get:
      operationId: listDatabaseTables
      summary: List inspectable application tables (owner only)
      security: *a3
      parameters: []
      responses:
        "200":
          description: Success. Never contains plaintext secrets or private keys.
          headers:
            ETag:
              description: Quoted vault revision when a vault exists.
              schema: *a2
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
